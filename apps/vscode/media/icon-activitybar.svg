  <circle cx="20.2" cy="12" r="1.3" fill="currentColor" />
  <circle cx="3.8" cy="12" r="1.3" fill="currentColor" />
  <path d="M12 7.5 L12 16.5 M7.5 12 L16.5 12" />
</svg>
