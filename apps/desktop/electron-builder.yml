appId: com.apicircle.studio
productName: APICircle Studio
copyright: 'Copyright © 2026 APICircle'

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/*.{md,markdown,test.ts,spec.ts}'
  - '!**/{tsconfig.json,vitest.config.ts,tsup.config.ts}'

extraResources:
  # The web build output is loaded by main.ts via file://; ship it inside
  # the app bundle.
  - from: ../web/dist
    to: web/dist

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

linux:
  category: Development
  target:
    - AppImage
    - deb
  icon: build/icon.png

asar: true
nodeGypRebuild: false
