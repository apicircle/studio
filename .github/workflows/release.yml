name: Release

# Publishes every non-private @apicircle/* package to npm at the version
# currently checked in to its package.json. Designed to release straight
# from the main branch — no changeset PR dance.
#
# Triggers:
#   - workflow_dispatch (manual button in the Actions tab) — the normal way
#     to cut a release. Optional `dry-run` input runs `npm publish --dry-run`
#     so you can preview the tarball without pushing anything to npm.
#   - push to main — auto-publishes whenever a commit lands on main that
#     bumps a publishable package version. Versions already on npm are
#     skipped, so re-running on an unrelated commit is a safe no-op.
#
# Publishable packages (anything in packages/* with "private": false):
#   @apicircle/shared, @apicircle/core, @apicircle/cli,
#   @apicircle/mock-server-core, @apicircle/mcp-server.
#
# Required secret: NPM_TOKEN — npm automation token for the `apicircle`
# account (the @apicircle scope is owned by that user).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run npm publish --dry-run (no tarballs pushed to npm)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish @apicircle/* packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          # Writes ~/.npmrc with the public registry + an auth line that
          # reads NODE_AUTH_TOKEN. `npm publish` picks it up automatically.
          registry-url: 'https://registry.npmjs.org'
          scope: '@apicircle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r check

      - name: Unit + integration tests
        run: pnpm test

      - name: Build workspace
        # Produces dist/ for every package via tsup. Required before publish
        # so the files referenced by each package's publishConfig
        # (./dist/index.{js,cjs,d.ts,d.cts}) exist when npm packs.
        run: pnpm build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail

          # Collect every non-private package directory under packages/*.
          # `pnpm m ls` would also work but reading package.json directly
          # keeps this independent of pnpm's filter syntax.
          mapfile -t pkg_dirs < <(
            for dir in packages/*/; do
              if [[ -f "$dir/package.json" ]]; then
                is_private=$(node -p "require('./$dir/package.json').private === true")
                if [[ "$is_private" != "true" ]]; then
                  echo "$dir"
                fi
              fi
            done
          )

          if [[ ${#pkg_dirs[@]} -eq 0 ]]; then
            echo "::error::No publishable packages found under packages/*"
            exit 1
          fi

          echo "Publishable packages:"
          for dir in "${pkg_dirs[@]}"; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            echo "  - $name@$version  ($dir)"
          done
          echo

          published=()
          skipped=()
          failed=()

          for dir in "${pkg_dirs[@]}"; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            # Skip if this exact version is already on npm. `npm view` exits
            # non-zero when the version is missing, so guard with `|| true`
            # and check the captured output.
            existing=$(npm view "$name@$version" version 2>/dev/null || true)
            if [[ "$existing" == "$version" ]]; then
              echo "↷ $name@$version already on npm — skipping"
              skipped+=("$name@$version")
              continue
            fi

            publish_args=(--access public --no-git-checks)
            if [[ "${DRY_RUN:-false}" == "true" ]]; then
              publish_args+=(--dry-run)
              echo "▶ [dry-run] publishing $name@$version"
            else
              echo "▶ publishing $name@$version"
            fi

            if (cd "$dir" && npm publish "${publish_args[@]}"); then
              published+=("$name@$version")
            else
              failed+=("$name@$version")
              # Keep going so one bad package doesn't block the others —
              # the job is marked failed at the end if any failed.
            fi
          done

          echo
          echo "── Release summary ──"
          echo "Published: ${#published[@]}"
          for p in "${published[@]:-}"; do [[ -n "$p" ]] && echo "  ✓ $p"; done
          echo "Skipped (already on npm): ${#skipped[@]}"
          for p in "${skipped[@]:-}"; do [[ -n "$p" ]] && echo "  · $p"; done
          echo "Failed: ${#failed[@]}"
          for p in "${failed[@]:-}"; do [[ -n "$p" ]] && echo "  ✗ $p"; done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::One or more packages failed to publish"
            exit 1
          fi

      - name: Tag release
        # Tag main with v<root-version> after a successful real publish,
        # so the desktop-release workflow has something to anchor against
        # and so `git log v1.0.2..` cleanly shows what shipped. Skipped on
        # dry runs and when the tag already exists.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run != true || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          root_version=$(node -p "require('./package.json').version")
          tag="v$root_version"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — leaving it alone."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Pushed tag $tag"
