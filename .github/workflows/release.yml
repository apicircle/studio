name: Release

# =============================================================================
# Release pipeline (Phase 2 acceptance — see plan §17 P29).
#
# Trigger: push to `main` of a branch named `changeset-release/*` (created by
# `pnpm changeset version`). The workflow:
#
#   1. publishes every workspace package whose version bumped (npm)
#   2. builds platform binaries for the CLI (Win / macOS / Linux × x64 / arm64)
#   3. builds Electron installers (NSIS / dmg / AppImage + deb)
#   4. attaches every artifact to a fresh GitHub Release
#
# All four jobs must succeed for the release to be considered shipped. The
# pipeline is idempotent — re-running it on the same tag is a no-op (npm
# rejects duplicate versions; gh release upload --clobber overwrites).
# =============================================================================

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changesets:
    name: npm publish (changesets)
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm --filter "./packages/*" build

      - name: Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-binaries:
    name: CLI binaries (${{ matrix.os }})
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-x64
          - os: macos-14
            target: macos-arm64
          - os: windows-latest
            target: win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - name: Package CLI binary
        shell: bash
        run: node scripts/release/buildBinaries.mjs --target=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli-${{ matrix.target }}*

  build-desktop:
    name: Desktop installers (${{ matrix.os }})
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - name: Build desktop renderer + main
        run: pnpm --filter @apicircle/desktop build
      - name: Build installers (electron-builder)
        run: node scripts/release/buildDesktopInstallers.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/*.exe
            apps/desktop/release/**/*.AppImage
            apps/desktop/release/**/*.deb

  github-release:
    name: GitHub Release
    needs: [changesets, build-binaries, build-desktop]
    if: needs.changesets.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ needs.changesets.outputs.publishedPackages }}
        run: |
          # Use the first published package's version as the release tag.
          TAG=$(echo "$PUBLISHED" | jq -r '.[0].name + "@" + .[0].version')
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/cli-*/cli-* \
            artifacts/desktop-*/* || echo "Release may already exist; trying upload --clobber"
          gh release upload "$TAG" \
            artifacts/cli-*/cli-* \
            artifacts/desktop-*/* \
            --clobber
