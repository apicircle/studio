name: Release

# Publishes the five public @apicircle/* packages to npm at the version
# currently checked in to each package.json. Designed to release straight
# from the main branch — no changeset PR dance.
#
# Triggers:
#   - workflow_dispatch — manual button in the Actions tab. Optional
#     `dry-run` input runs `npm publish --dry-run` so you can preview
#     the tarball without pushing anything to npm.
#   - push to main — auto-publishes whenever a commit lands on main that
#     bumps a publishable package version. Versions already on npm are
#     skipped, so re-running on an unrelated commit is a safe no-op.
#
# Packages published (explicit allowlist — keep in sync with the matrix):
#   @apicircle/shared
#   @apicircle/core
#   @apicircle/mock-server-core
#   @apicircle/mcp-server
#   @apicircle/cli
#
# Other workspace members (@apicircle/git, @apicircle/ui-components,
# @apicircle/web, @apicircle/desktop, examples/*) are intentionally NOT
# published — they're either private or internal-only.
#
# Required secret: NPM_TOKEN — npm automation token for the `apicircle`
# account (the @apicircle scope is owned by that user).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run npm publish --dry-run (no tarballs pushed to npm)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  # Single source of truth for what ships. Space-separated list of the
  # pnpm package names to publish. The build step uses these as
  # `--filter` arguments; the publish step iterates them.
  RELEASE_PACKAGES: '@apicircle/shared @apicircle/core @apicircle/mock-server-core @apicircle/mcp-server @apicircle/cli'

jobs:
  release:
    name: Publish @apicircle/* packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          # Writes ~/.npmrc with the public registry + an auth line that
          # reads NODE_AUTH_TOKEN. `npm publish` picks it up automatically.
          registry-url: 'https://registry.npmjs.org'
          scope: '@apicircle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (release packages only)
        shell: bash
        run: |
          set -euo pipefail
          filters=""
          for pkg in $RELEASE_PACKAGES; do
            filters+=" --filter $pkg"
          done
          # shellcheck disable=SC2086
          pnpm $filters check

      - name: Unit tests (release packages only)
        shell: bash
        run: |
          set -euo pipefail
          filters=""
          for pkg in $RELEASE_PACKAGES; do
            filters+=" --filter $pkg"
          done
          # shellcheck disable=SC2086
          pnpm $filters test

      - name: Build release packages
        # `--filter <pkg>...` (note the trailing `...`) tells pnpm to build
        # the package AND its workspace dependencies, but nothing else.
        # That excludes apps/web, apps/desktop, examples/*, and any
        # private packages that aren't depended on by the release set.
        shell: bash
        run: |
          set -euo pipefail
          filters=""
          for pkg in $RELEASE_PACKAGES; do
            filters+=" --filter ${pkg}..."
          done
          # shellcheck disable=SC2086
          pnpm $filters build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail

          # Resolve each release package name to its on-disk directory by
          # reading the workspace manifest. This avoids hard-coding
          # packages/<name> paths in case a package ever moves.
          declare -A pkg_dirs
          for pkg in $RELEASE_PACKAGES; do
            dir=$(pnpm --filter "$pkg" exec node -p 'process.cwd()' | tail -n1)
            if [[ -z "$dir" || ! -f "$dir/package.json" ]]; then
              echo "::error::Could not resolve directory for $pkg"
              exit 1
            fi
            pkg_dirs[$pkg]="$dir"
          done

          echo "Release set:"
          for pkg in $RELEASE_PACKAGES; do
            version=$(node -p "require('${pkg_dirs[$pkg]}/package.json').version")
            echo "  - $pkg@$version  (${pkg_dirs[$pkg]})"
          done
          echo

          published=()
          skipped=()
          failed=()

          for pkg in $RELEASE_PACKAGES; do
            dir="${pkg_dirs[$pkg]}"
            version=$(node -p "require('$dir/package.json').version")

            # Skip if this exact version is already on npm. `npm view`
            # exits non-zero when the version is missing, so guard with
            # `|| true` and check the captured output.
            existing=$(npm view "$pkg@$version" version 2>/dev/null || true)
            if [[ "$existing" == "$version" ]]; then
              echo "↷ $pkg@$version already on npm — skipping"
              skipped+=("$pkg@$version")
              continue
            fi

            publish_args=(--access public --no-git-checks)
            if [[ "${DRY_RUN:-false}" == "true" ]]; then
              publish_args+=(--dry-run)
              echo "▶ [dry-run] publishing $pkg@$version"
            else
              echo "▶ publishing $pkg@$version"
            fi

            if (cd "$dir" && npm publish "${publish_args[@]}"); then
              published+=("$pkg@$version")
            else
              failed+=("$pkg@$version")
              # Keep going so one bad package doesn't block the others;
              # the job is marked failed at the end if any failed.
            fi
          done

          echo
          echo "── Release summary ──"
          echo "Published: ${#published[@]}"
          for p in "${published[@]:-}"; do [[ -n "$p" ]] && echo "  ✓ $p"; done
          echo "Skipped (already on npm): ${#skipped[@]}"
          for p in "${skipped[@]:-}"; do [[ -n "$p" ]] && echo "  · $p"; done
          echo "Failed: ${#failed[@]}"
          for p in "${failed[@]:-}"; do [[ -n "$p" ]] && echo "  ✗ $p"; done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::One or more packages failed to publish"
            exit 1
          fi

      - name: Tag release
        # Tag main with v<root-version> after a successful real publish,
        # so the desktop-release workflow has something to anchor against
        # and so `git log v1.0.2..` cleanly shows what shipped. Skipped on
        # dry runs and when the tag already exists.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run != true || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          root_version=$(node -p "require('./package.json').version")
          tag="v$root_version"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — leaving it alone."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Pushed tag $tag"
