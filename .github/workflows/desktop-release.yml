name: Desktop Release

# Builds the Electron installers on each native host (linux/macos/windows) and,
# when triggered by a `v*` tag or an explicit workflow_dispatch opt-in,
# publishes them to a GitHub Release together with electron-updater's
# `latest*.yml` index files. Casual runs (re-run, dispatch with publish=false)
# only upload artifacts and never touch the Releases API, so a missing
# code-signing cert or release token can't fail the pipeline.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers to GitHub Releases (otherwise only upload as workflow artifacts)
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # fail-fast off so a broken signing pipeline on one OS doesn't kill the
    # whole release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tag + history needed so electron-builder can stamp the release
          # notes from the git log when --publish always is set.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux packaging tools
        # electron-builder produces the `deb` target via dpkg + fakeroot. They
        # are usually preinstalled on ubuntu-latest, but recent runner-image
        # refreshes have occasionally dropped fakeroot — when that happens the
        # AppImage builds and uploads fine, then deb packaging fails and
        # marks the whole job red. Installing explicitly removes the variance.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - name: Verify tag matches apps/desktop/package.json version
        # When this workflow is fired by a `v*` tag, the package.json version
        # MUST match the tag — otherwise electron-builder names artifacts and
        # creates the Release using the package.json version, silently
        # uploading to the wrong (or pre-existing) Release. Failing fast here
        # surfaces the mismatch before any build cost is paid.
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$tag" != "$pkg" ]]; then
            echo "::error::Tag v$tag does not match apps/desktop/package.json version $pkg. Bump apps/desktop/package.json (and run pnpm install --lockfile-only) before retagging."
            exit 1
          fi
          echo "Tag and package version both at $pkg ✓"

      - name: Build workspace (web renderer + desktop main)
        # `turbo build` walks the workspace graph so @apicircle/web (renderer)
        # and the shared/core/ui packages it depends on land in dist/ before
        # electron-builder packages the asar.
        run: pnpm build

      - name: Resolve publish mode
        id: publish_mode
        shell: bash
        run: |
          # Tag pushes always publish. Manual dispatch publishes only when
          # the input is checked. Everything else (re-run, branch push that
          # got here somehow) stays on "never".
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            mode="always"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            mode="always"
          else
            mode="never"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Publish mode: $mode"

      - name: Build installers
        shell: bash
        env:
          # GH_TOKEN is what electron-builder reads when publishing to GitHub.
          # The default GITHUB_TOKEN scope (contents:write, set above) is
          # sufficient for uploading release assets to the same repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Optional code-signing wiring. When any of these secrets are
          # missing, GitHub substitutes an empty string — and electron-
          # builder treats an empty CSC_LINK as a literal path, resolves
          # it to the cwd, and fails with "not a file". The run script
          # below unsets these env vars when empty so electron-builder
          # cleanly falls back to producing unsigned artifacts.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Disable electron-builder's auto-discovery of macOS signing
          # identities. On macos-14 (Apple Silicon) runners the system
          # keychain has a stub identity that electron-builder picks up,
          # then fails to use — the dmg step dies in ~30-60s before
          # producing any artifact. With auto-discovery off, missing
          # CSC_LINK/APPLE_* secrets cleanly produce unsigned dmgs, which
          # is what we ship until real Developer ID certs land.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          # Unset any empty signing env vars so electron-builder treats
          # them as "not provided" rather than "provided but empty". This
          # is the difference between "produce unsigned artifact" (good)
          # and "try to read empty path as cert file → ENOENT" (bad).
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!v}" ]]; then
              unset "$v"
            fi
          done

          pnpm --filter @apicircle/desktop exec electron-builder \
            --config electron-builder.yml \
            --publish "${{ steps.publish_mode.outputs.mode }}"

      - name: Upload installer artifacts
        # Always upload so a failing publish step still leaves something
        # downloadable on the workflow run for triage.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          # Each runner only emits its own platform's installers, so the
          # globs that don't match are expected — don't fail the step.
          if-no-files-found: ignore
          retention-days: 14
