name: E2E

# Playwright E2E suites — the chromium web run is the gate, with cross-browser
# smoke + the desktop Electron suite running alongside on main. The visual
# baseline job is manual-dispatch only (see its block below). The coverage
# delta script (scripts/e2e_coverage_delta.mjs) gates PRs against the most
# recent successful main run.
#
# Trigger model:
#   - pull_request → playwright (chromium web) + coverage-delta only.
#     Cross-browser / desktop don't gate PR merges; they run on main.
#   - push to main → all jobs except visual-baseline.
#   - workflow_dispatch → all jobs (use this to (re)generate visual baselines).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    # Each matrix entry runs ~1/8 of the chromium suite in parallel. Wall-clock
    # for the whole gate drops from ~45 min (single job) to ~7-10 min
    # (slowest shard). Per-shard outputs are written as Playwright `blob`
    # reports and merged by the `playwright-merge` job below, which is where
    # the coverage gate + unified HTML report live.
    name: Playwright shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # The e2e-web suite imports from @apicircle/core / @apicircle/shared at
        # runtime via the dev server's module graph, so the dist outputs must
        # exist before Playwright boots.
        run: pnpm --filter @apicircle/web... build

      - name: Install Playwright Chromium
        # `chromium-headless-shell` is the variant Playwright 1.49+ launches
        # when `chromium.launch()` runs in headless mode (the default in CI).
        # globalSetup.ts uses that path, so the shell binary must be present
        # in addition to the regular chromium build.
        run: pnpm --filter @apicircle/e2e-web exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run shard ${{ matrix.shard }}/8
        # `--shard=K/N` deterministically picks ~1/N of the tests for this
        # job. `--reporter=blob` emits a single shard-scoped binary report
        # that the merge job downloads + combines below.
        run: |
          pnpm --filter @apicircle/e2e-web exec playwright test \
            --project=chromium \
            --shard=${{ matrix.shard }}/8 \
            --reporter=blob

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/web/blob-report
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: e2e/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  playwright-merge:
    # Aggregates the 8 shard blobs into a single HTML report + JSON result
    # set, then runs the strict coverage gate against that aggregate. Runs
    # even if some shards failed so we still publish a merged report
    # showing every failure across the suite.
    name: Merge shard reports + coverage gate
    needs: playwright
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install coverage-report Python deps
        # `scripts/e2e_coverage_report.py` reads the workbook fixtures via
        # `openpyxl`. No project-level requirements.txt yet, so install ad-hoc.
        run: pip install openpyxl

      - name: Download all shard blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into unified HTML + JSON
        # The merged JSON lands at e2e/web/test-results.json (the same
        # path single-job runs would write) so the coverage script doesn't
        # need to special-case the sharded layout. If the download step
        # produced no blob reports (all shards crashed before emitting),
        # skip the merge — playwright merge-reports errors on an empty
        # input dir, and the shard-failure gate at the end of this job
        # is what should surface those crashes.
        working-directory: e2e/web
        env:
          # The json reporter writes to this env var when set; otherwise
          # it dumps to stdout. Pin it so we land at e2e/web/test-results.json
          # (the same path the single-job CI configuration would write).
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results.json
        run: |
          mkdir -p ../../all-blob-reports
          mkdir -p playwright-report
          if [ -z "$(ls -A ../../all-blob-reports 2>/dev/null)" ]; then
            echo "::warning::No blob reports to merge — all shards may have crashed before emitting. Skipping merge; shard-failure gate will surface the underlying failures."
            # Emit an empty JSON skeleton so downstream steps that read
            # the file don't error on a missing path.
            echo '{"config":{},"suites":[],"errors":[],"stats":{"expected":0,"unexpected":0,"flaky":0,"skipped":0}}' > test-results.json
          else
            pnpm exec playwright merge-reports \
              --reporter=html,json \
              ../../all-blob-reports
          fi

      - name: Compute coverage report (strict)
        if: always()
        run: |
          python3 scripts/e2e_coverage_report.py \
            --strict \
            --json \
            --from-results=e2e/web/test-results.json \
            --fail-under=20

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-${{ github.run_id }}
          path: |
            docs/qa/results/e2e-coverage.json
            docs/qa/results/e2e-coverage.md
          retention-days: 30
          if-no-files-found: warn

      - name: Upload merged Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-web-${{ github.run_id }}
          path: e2e/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the job if any shard failed
        # `needs: playwright` with `if: always()` lets us run even when
        # shards fail (so we still publish the merged report), but the
        # gate's exit code must reflect shard health.
        if: contains(needs.playwright.result, 'failure')
        run: |
          echo "::error::One or more playwright shards failed — see the merged report."
          exit 1

  coverage-delta:
    name: Coverage delta vs main
    needs: playwright-merge
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Download PR coverage artifact
        uses: actions/download-artifact@v5
        with:
          name: e2e-coverage-${{ github.run_id }}
          path: docs/qa/results/

      - name: Compare coverage vs main baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: node scripts/e2e_coverage_delta.mjs

  cross-browser-smoke:
    name: Cross-browser smoke (${{ matrix.browser }})
    # Only run on main + manual dispatch. PRs gate on chromium only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @apicircle/web... build

      - name: Install Playwright browsers (chromium + ${{ matrix.browser }})
        # globalSetup launches chromium to pre-warm the dev server's lazy
        # module graph (see e2e/web/global-setup.ts) — so even firefox /
        # webkit projects need chromium installed before any test runs.
        # Headless launches in Playwright 1.49+ use `chromium-headless-shell`,
        # which is shipped as a separate browser bundle, so install it too.
        run: pnpm --filter @apicircle/e2e-web exec playwright install --with-deps chromium chromium-headless-shell ${{ matrix.browser }}

      - name: Run @smoke tests in ${{ matrix.browser }}
        run: pnpm --filter @apicircle/e2e-web exec playwright test --project=${{ matrix.browser }}-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: e2e/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  visual-baseline:
    name: Visual baseline (chromium)
    # Manual-dispatch only. Visual-snapshot diffs are sensitive to the
    # runner-vs-local font stack and the Linux baselines aren't committed
    # yet, so the job is off by default. Trigger it on demand from the
    # Actions tab → "Run workflow" when you want to (re)generate the
    # `-linux.png` baselines; download the
    # `visual-baseline-snapshots-<run_id>` artifact, sanity-check, and
    # commit the PNGs under `e2e/web/visual-baseline.spec.ts-snapshots/`.
    # Local devs refresh the baseline with `--update-snapshots` after
    # intentional visual changes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @apicircle/web... build

      - name: Install Playwright Chromium
        # See playwright shard job above — `chromium-headless-shell` is
        # required for globalSetup's headless launch on Playwright 1.49+.
        run: pnpm --filter @apicircle/e2e-web exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run visual baseline project
        run: pnpm test:e2e:visual

      - name: Upload generated baseline candidates
        # Captures both the actuals (for first-run baseline bootstrap) and
        # any diff PNGs (for subsequent regression triage). Maintainer
        # workflow on first failure: download this artifact, copy the
        # `-actual.png` files into the spec's `-snapshots/` dir, commit.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline-snapshots-${{ github.run_id }}
          path: |
            e2e/web/test-results
            e2e/web/visual-baseline.spec.ts-snapshots
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline-diffs-${{ github.run_id }}
          path: |
            e2e/web/test-results
            e2e/web/__screenshots__
          retention-days: 14
          if-no-files-found: ignore

  desktop:
    name: Desktop (Electron · ${{ matrix.os }})
    # Electron on the runner needs an X server; we run on linux only for now
    # via xvfb-run. macOS/Windows runners exist if we want to wire them in
    # later, but the suite is platform-neutral by design.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages and desktop main
        # The specs that spawned the CLI and MCP binaries moved to the Lens
        # repo with those packages; only the desktop main bundle is needed
        # here. Filtering on a package that no longer exists would hard-fail
        # with "No projects matched the filters".
        run: |
          pnpm --filter @apicircle/desktop build

      - name: Install Electron runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Run desktop E2E suite under xvfb
        run: xvfb-run -a pnpm test:e2e:desktop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-desktop-${{ matrix.os }}-${{ github.run_id }}
          path: e2e/desktop/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-desktop-${{ matrix.os }}-${{ github.run_id }}
          path: e2e/desktop/test-results
          retention-days: 7
          if-no-files-found: ignore
